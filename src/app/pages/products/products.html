<h1 id="title">Sección de Productos</h1>

<!-- 
    lg -> LARGER
    lg: tamaño de pantalla más grande -> PC, TELEVISOR

    md -> MEDIA
    md: tamaño de pantalla mediano/ medio -> TABLET

    sm -> SMALL
    sm: tamaño de pantalla chico -> CELULAR
-->

<div class="container">
    <div class="row">
        <!-- 
            *ngFor -> directiva REPETITIVA para iterar colecciones o arreglos 
            - Funcionalidad similar o misma que repetitiva "for", "forEach"
            - let i -> definición de la variable que representa un elemento
            de la colección "infoTarjeta" (permite iterar)
        -->
        <div *ngFor="let i of infoTarjeta" class="col-lg-3 col-md-6 col-sm-12 col-xs-12 mb-4">
            <div class="card">
                <!-- {{ i.propiedad }} -> interpolación para propiedades -->
                <img src="{{ i.img }}" class="card-img-top" alt="{{ i.alt }}">

                <div class="card-body">
                    <h5 class="card-title">{{ i.titulo }}</h5>
                    <p class="card-text">
                        {{ i.descripcion }}
                    </p>
                    <p class="card-text">
                        {{ i.fechaPostal | date: 'yy/MM/dd' }} - ${{ i.precio }}
                    </p>

                    <!-- Botón para activar modal -->
                    <!-- Enviamos por parámetro del evento "click" a un elemento seleccionado de la colección -->
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#verMas"
                        (click)="verMas(i)">
                        Ver más
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal BIDIRECCIONAL -->
<div class="modal fade" id="verMas" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <!-- ? -> admite propiedades de la variable aún si son nulas -->
                <h1 class="modal-title fs-5" id="exampleModalLabel">{{ productoSeleccionado?.titulo }}</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <!-- Imagen del modal -->
                <div class="modal-img">
                    <img src="{{ productoSeleccionado?.img }}" alt="{{ productoSeleccionado?.alt }}">
                </div>

                <!-- Descripción del modal -->
                <div class="modal-info">
                    <p>{{ productoSeleccionado?.descripcion }}</p>

                    <p>
                        {{ productoSeleccionado?.fechaPostal | date: 'yy/MM/dd' }} - ${{ productoSeleccionado?.precio }}
                    </p>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
