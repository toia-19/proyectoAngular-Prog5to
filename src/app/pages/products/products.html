<h1 class="title">Sección de Productos</h1>

<!-- 
    lg -> LARGER
    lg: tamaño de pantalla más grande -> PC

    MD -> MEDIA
    md: tamaño de pantalla medio -> TABLET

    SM -> SMALL
    sm: tamaño de pantalla chico -> CELULAR
-->

<div class="container">
    <div class="row">
        <!--
            - ngFor -> DIRECTIVA que permite ITERAR colecciones/ arreglos
            funcionalidad similar al "for", "forEach" 

            - let i -> definición de la variable que representa 1 elemento 
            de la colección "infoTarjeta" (permite iterar)
        -->
        
        <div *ngFor="let i of infoTarjeta;" class="col-3">
            <div class="card">
                <img src="{{ i.img }}" class="card-img-top" alt="{{ i.alt }}">
                <div class="card-body">
                    <!-- Interpolación -> permite acceder a una propiedad 
                     específica del modelo -->
                    <h5 class="card-title">{{ i.titulo }}</h5>
                    <p class="card-text">{{ i.descripcion }} - {{ i.anualPublicacion }}</p>

                    <a href="#" class="btn btn-primary">Ver Más</a>
                </div>
            </div>
        </div>
    </div>
</div>
