<h1 class="title">Sección de Productos</h1>

<!-- 
    lg -> LARGER
    lg: tamaño de pantalla más grande -> PC

    MD -> MEDIA
    md: tamaño de pantalla medio -> TABLET

    SM -> SMALL
    sm: tamaño de pantalla chico -> CELULAR
-->

<div class="container">
    <div class="row">
        <!--
            - ngFor -> DIRECTIVA que permite ITERAR colecciones/ arreglos
            funcionalidad similar al "for", "forEach" 

            - let i -> definición de la variable que representa 1 elemento 
            de la colección "infoTarjeta" (permite iterar)
        -->

        <div *ngFor="let i of infoTarjeta" class="col-lg-3 col-md-6 col-sm-12 col-xs-12 mb-4">
            <div class="card">
                <img src="{{ i.img }}" class="card-img-top" alt="{{ i.alt }}">
                <div class="card-body">
                    <!-- Interpolación -> permite acceder a una propiedad 
                     específica del modelo -->
                    <h5 class="card-title">{{ i.titulo }}</h5>
                    <p class="card-text">{{ i.descripcion }} - {{ i.anualPublicacion }} </p>

                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#verMasInfo"
                        (click)="verMas(i)">
                        Ver Más
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="verMasInfo" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">{{ tarjetaSeleccionada?.titulo }}</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="modal-imagen">
                    <img src="{{ tarjetaSeleccionada?.img }}" alt="{{ tarjetaSeleccionada?.alt }}">
                </div>

                <div class="modal-descripcion">
                    {{ tarjetaSeleccionada?.descripcion }}
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
